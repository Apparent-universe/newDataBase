{% extends "base.html" %}

{% block title %}地图搜索 - 丢物小助手{% endblock %}

{% block extra_css %}
<style>
#map-container {
    height: 600px;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}

.map-controls {
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 1rem;
    margin-bottom: 1rem;
}

@media (max-width: 768px) {
    #map-container {
        height: 400px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="map-controls">
                <h4 class="mb-0">地图搜索</h4>
                <small class="text-muted">查看所有拾获物品的位置分布</small>
            </div>
        </div>
        
        <div class="col-12">
            <div class="card">
                <div class="card-body p-0">
                    <div id="map-container">
                        <div class="d-flex justify-content-center align-items-center h-100">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">地图加载中...</span>
                                </div>
                                <p class="mt-2">正在加载地图...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- 高德地图API -->
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key={{ config.AMAP_JS_API_KEY }}&plugin=AMap.Geolocation"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 简单的地图初始化
    if (typeof AMap !== 'undefined') {
        var map = new AMap.Map('map-container', {
            zoom: 13,
            center: [116.397428, 39.90923]
        });
        
        // 加载地图数据
        fetch('/api/map/records')
            .then(response => response.json())
            .then(data => {
                if (data.success && data.records) {
                    data.records.forEach(record => {
                        var marker = new AMap.Marker({
                            position: [record.longitude, record.latitude],
                            title: record.pickup_location
                        });
                        map.add(marker);
                    });
                    
                    if (data.records.length > 0) {
                        var markers = map.getAllOverlays('marker');
                        map.setFitView(markers);
                    }
                }
            })
            .catch(error => {
                console.error('加载地图数据失败:', error);
            });
    }
});
</script>
{% endblock %}
