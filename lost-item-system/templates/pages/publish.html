{% extends "base.html" %}

{% block title %}发布拾获物品 - 丢物小助手{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center mb-0 fs-4">发布拾获物品信息</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('item.publish') }}" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="pickup_location" class="form-label">拾获地点</label>
                        <input type="text" class="form-control" id="pickup_location" name="pickup_location" required
                               placeholder="请输入拾获地点，例如：图书馆一楼">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label d-block">物品信息</label>
                        <div id="items-container">
                            <div class="item-entry mb-3">
                                <div class="card">
                                    <div class="card-body p-3">
                                        <div class="row g-2">
                                            <div class="col-12">
                                                <input type="text" class="form-control" name="items[][name]" 
                                                       placeholder="物品名称" required>
                                            </div>
                                            <div class="col-12 d-flex justify-content-end mt-2">
                                                <button type="button" class="btn btn-outline-danger btn-sm remove-item">
                                                    删除物品
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-primary w-100 mt-3" id="add-item">
                            <i class="bi bi-plus-circle"></i> 添加物品
                        </button>
                    </div>

                    <div class="mb-4">
                        <label for="detailed_description" class="form-label">详细描述</label>
                        <textarea class="form-control" id="detailed_description" name="detailed_description" 
                                  rows="4" required placeholder="请详细描述物品的特征和拾获情况"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="hidden_info" class="form-label">隐藏信息（仅探员可见）</label>
                        <textarea class="form-control" id="hidden_info" name="hidden_info" 
                                  rows="3" placeholder="可以添加一些细节信息，帮助确认失主身份"></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">发布信息</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script src="{{ url_for('static', filename='js/publish.js') }}"></script>
{% endblock %}

{% block extra_css %}
<style>
.item-entry {
    transition: opacity 0.3s ease-out;
}
.fade-out {
    opacity: 0;
}
@media (max-width: 768px) {
    .card-body {
        padding: 1rem;
    }
}
</style>
{% endblock %}

{% endblock %}
