{% extends "base.html" %}

{% block title %}发布拾获物品 - 丢物小助手{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center mb-0 fs-4">发布拾获物品信息</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('item.publish') }}" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="pickup_location" class="form-label">拾获地点 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="pickup_location" name="pickup_location" 
                                   placeholder="请描述拾获地点" required>
                            <button type="button" class="btn btn-outline-primary" id="select-location-btn">
                                <i class="fas fa-map-marker-alt"></i> 地图选点
                            </button>
                        </div>
                        <div class="form-text">建议使用地图选点功能获取精确位置</div>
                        
                        <!-- 隐藏的地理位置字段 -->
                        <input type="hidden" id="latitude" name="latitude">
                        <input type="hidden" id="longitude" name="longitude">
                        <input type="hidden" id="formatted_address" name="formatted_address">
                        
                        <!-- 地图选择区域 -->
                        <div id="location-selector" class="mt-3" style="display: none;">
                            <div class="card">
                                <div class="card-header">
                                    <h6 class="mb-0">选择精确位置</h6>
                                </div>
                                <div class="card-body">
                                    <div id="location-map" style="height: 400px; width: 100%;"></div>
                                    <div class="mt-3">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <strong>选中位置：</strong>
                                                <span id="selected-address" class="text-muted">点击地图选择位置</span>
                                            </div>
                                            <div>
                                                <button type="button" class="btn btn-secondary me-2" id="cancel-location-btn">取消</button>
                                                <button type="button" class="btn btn-primary" id="confirm-location-btn" disabled>确认位置</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label d-block">物品信息</label>
                        <div id="items-container">
                            <div class="item-entry mb-3">
                                <div class="card">
                                    <div class="card-body p-3">
                                        <div class="row g-2">
                                            <div class="col-12">
                                                <input type="text" class="form-control" name="items[][name]" 
                                                       placeholder="物品名称" required>
                                            </div>
                                            <div class="col-12 d-flex justify-content-end mt-2">
                                                <button type="button" class="btn btn-outline-danger btn-sm remove-item">
                                                    删除物品
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-primary w-100 mt-3" id="add-item">
                            <i class="bi bi-plus-circle"></i> 添加物品
                        </button>
                    </div>

                    <div class="mb-4">
                        <label for="detailed_description" class="form-label">详细描述</label>
                        <textarea class="form-control" id="detailed_description" name="detailed_description" 
                                  rows="4" required placeholder="请详细描述物品的特征和拾获情况"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="hidden_info" class="form-label">隐藏信息（仅探员可见）</label>
                        <textarea class="form-control" id="hidden_info" name="hidden_info" 
                                  rows="3" placeholder="可以添加一些细节信息，帮助确认失主身份"></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">发布信息</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<!-- 高德地图API -->
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key={{ config.AMAP_JS_API_KEY }}&plugin=AMap.Geolocation,AMap.Geocoder"></script>
<script src="{{ url_for('static', filename='js/publish.js') }}"></script>
{% endblock %}

{% block extra_css %}
<style>
.item-entry {
    transition: opacity 0.3s ease-out;
}
.fade-out {
    opacity: 0;
}
@media (max-width: 768px) {
    .card-body {
        padding: 1rem;
    }
}
</style>
{% endblock %}

{% endblock %}
